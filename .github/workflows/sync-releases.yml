name: Sync Releases to GitHub

on:
  push:
    paths:
      - 'releases/**'
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Identify and Sync Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 寻找最新的 ZIP 文件
          ZIP_FILE=$(ls releases/*.zip | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found in releases/ directory."
            exit 0
          fi

          # 从文件名解析版本号 (严格匹配数字点号结构，避免带入结尾的句号)
          VERSION_RAW=$(echo "$ZIP_FILE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          VERSION="v$VERSION_RAW"

          if [ -z "$VERSION_RAW" ]; then
            echo "Failed to parse version from $ZIP_FILE"
            exit 1
          fi

          echo "Detected Version: $VERSION"
          echo "File Path: $ZIP_FILE"

          # 检查 Release 是否已存在
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Updating existing release $VERSION..."
            gh release upload "$VERSION" "$ZIP_FILE" --clobber
          else
            echo "Creating new release $VERSION..."
            gh release create "$VERSION" "$ZIP_FILE" \
              --title "$VERSION - ScreenPen Unlocked" \
              --notes "Automated release synced from repository directory. This version includes latest PRO enhancements."
          fi
